# MVP single-node local dev (spec §3). Currently just Postgres, since it's the only piece M1.5
# needs; leanserv/api services join here once M1.8 makes them runnable.
#
# Usage:
#   docker compose -f deploy/compose.yaml up -d
#   DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/leanagent \
#     uv run alembic upgrade head
#   TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/leanagent \
#     uv run pytest tests/db

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leanagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
