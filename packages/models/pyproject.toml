[project]
name = "lean-agent-models"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lean-agent-core", "jinja2>=3.1", "tokenizers>=0.20"]

[tool.uv.sources]
lean-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_agent_models"]
