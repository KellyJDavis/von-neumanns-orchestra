[project]
name = "lean-agent-serv"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lean-agent-core", "fastapi>=0.115", "httpx"]

[tool.uv.sources]
lean-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_agent_serv"]
