[project]
name = "lean-agent-cli"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["lean-agent-core", "httpx"]

[tool.uv.sources]
lean-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_agent_cli"]

[project.scripts]
lean-agent = "lean_agent_cli.main:main"
