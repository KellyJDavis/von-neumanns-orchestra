name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # tests/db/ needs a real PostgreSQL instance (never a mock, per CLAUDE.md) -- this service
    # is why. Without it, tests/db/ would skip gracefully rather than fail (see its own
    # connectivity check), which would silently stop testing the schema in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leanagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/leanagent
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/leanagent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict packages
      - run: uv run alembic upgrade head
      - name: Apply deploy/grants.sql
        # Via psycopg rather than the `psql` binary, so this doesn't depend on a Postgres client
        # being preinstalled on the runner. autocommit + a single multi-statement execute is
        # equivalent to `psql -f`: libpq's simple query protocol runs a semicolon-separated
        # script as-is, which is what grants.sql's DO block and CREATE FUNCTION body both need.
        run: |
          uv run python -c "
          import psycopg
          with psycopg.connect('postgresql://postgres:postgres@localhost:5432/leanagent', autocommit=True) as conn:
              conn.execute(open('deploy/grants.sql').read())
          "
      - run: uv run pytest

  plugin-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any packages/* module imports plugins/
        run: |
          if grep -RInE '^\s*(import|from)\s+plugins(\.|(\s|$))' packages/ ; then
            echo "::error::packages/* must never import from plugins/ (see plugins/README.md)"
            exit 1
          fi

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: packages/leankernel
          test: true
      # tests/leanserv/ spawns the real `leankernel serve` binary this job just built (M1.8.1) --
      # never a mock, per CLAUDE.md. It lives in this job, not the `python` job, specifically so
      # the Lean toolchain + Mathlib setup (and its cache) stays in one place rather than being
      # duplicated into a job that otherwise has no reason to need it. `lean-action` leaves
      # `elan`/`lake` on PATH for the steps below via the same mechanism it uses internally.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: uv run pytest tests/leanserv
